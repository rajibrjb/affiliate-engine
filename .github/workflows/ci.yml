name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  php-lint:
    name: PHP lint (mu-plugins + theme-files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint every PHP file
        run: |
          set -e
          status=0
          for f in $(find wordpress/mu-plugins wordpress/theme-files -name '*.php'); do
            php -l "$f" || status=1
          done
          exit $status

  workflow-json-validate:
    name: Validate n8n workflow JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: jq-validate every workflow file
        run: |
          set -e
          status=0
          for f in workflows/*.json; do
            jq empty "$f" || { echo "Invalid JSON: $f"; status=1; }
          done
          exit $status

  review-app-test:
    name: review-app tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: review-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: review-app/package-lock.json
      - run: npm install
      - run: npm test
