name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  php-lint:
    name: PHP lint (mu-plugins + theme-files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint every PHP file
        run: |
          set -e
          status=0
          for f in $(find wordpress/mu-plugins wordpress/theme-files -name '*.php'); do
            php -l "$f" || status=1
          done
          exit $status

  deploy:
    name: Deploy to Hostinger
    needs: [php-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HOSTINGER_SSH_PORT }}" "${{ secrets.HOSTINGER_SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy mu-plugins
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.HOSTINGER_SSH_PORT }}" \
            wordpress/mu-plugins/ \
            "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:${{ secrets.HOSTINGER_DEPLOY_PATH }}/wp-content/mu-plugins/"
      - name: Deploy theme files
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.HOSTINGER_SSH_PORT }}" \
            wordpress/theme-files/ \
            "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:${{ secrets.HOSTINGER_DEPLOY_PATH }}/wp-content/themes/rehub-blankchild/"
