<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0B0B0B}
  .box{width:1120px;height:280px;display:flex;align-items:center;justify-content:center}
  .lockup{display:flex;align-items:center;gap:22px}
  .word{font-family:'Poppins',sans-serif;font-weight:700;font-size:74px;letter-spacing:-0.02em;white-space:nowrap}
  .word .r{color:#F8FAFC}
  .word .g{color:#38BDF8}
</style>
</head>
<body>
<div class="box">
  <div class="lockup">
    <svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#38BDF8"/>
          <stop offset="1" stop-color="#14B8A6"/>
        </linearGradient>
      </defs>
      <rect x="3" y="3" width="114" height="114" rx="30" fill="url(#g)"/>
      <circle cx="49" cy="49" r="23" fill="none" stroke="#0B0B0B" stroke-width="8.5"/>
      <line x1="66" y1="66" x2="91" y2="91" stroke="#0B0B0B" stroke-width="10" stroke-linecap="round"/>
      <path d="M38 50 L46 58 L62 40" fill="none" stroke="#0B0B0B" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="word"><span class="r">Review</span><span class="g">GeekHub</span></div>
  </div>
</div>
</body></html>
